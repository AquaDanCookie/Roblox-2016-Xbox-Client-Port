[package]
name = "roblox-2016-xbox"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Rust reimplementation of the 2016 Roblox Xbox One shell"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.37", default-features = true }
egui = "0.37"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", features = ["json", "query"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gilrs = "0.11"
rodio = "0.23"
directories = "6"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
fs2 = "0.4"
thiserror = "2"
keyring = "4.2.0"
secrecy = "0.10.3"
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_16", "v2_20"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
