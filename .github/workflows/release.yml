name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="roblox-2016-xbox-${version}"
          mkdir -p "release/${stage}"
          cp target/release/roblox-2016-xbox "release/${stage}/"
          cp install.sh uninstall.sh README.md "release/${stage}/"
          cp -r packaging "release/${stage}/"
          tar -C release -czf "release/roblox-2016-xbox-${version}-x86_64-linux.tar.gz" "${stage}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/roblox-2016-xbox-*-x86_64-linux.tar.gz
          generate_release_notes: true
